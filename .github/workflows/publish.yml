# Lives only on the `release` branch (copied there by scripts/push-release.sh from main:release-branch/).
# The branch holds the built package only; this job publishes it to npm via Trusted Publishing (OIDC):
# no npm token is stored anywhere. Configure it once on npmjs.com → package Settings → Trusted Publisher
# (GitHub Actions, repo tnthangvn/quick-edit-nbl-publish, workflow publish.yml).
name: Publish to npm

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing (also signs provenance)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted Publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@11

      - name: Skip if version already published
        id: check
        run: |
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish --access public
